name: "Publish @facioquo/indy-charts"

# Changesets-driven releases; see .changeset/README.md for the full flow.
# A merged changeset opens the "Version Packages" PR; merging that publishes.
# Both paths trigger it: changesets arrive under .changeset/, and the version
# commit lands under libs/indy-charts/.
on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "libs/indy-charts/**"
  workflow_dispatch: {}

# Not cancel-in-progress: a cancelled publish could leave the registry and the
# repository disagreeing about what shipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24

permissions:
  contents: read

jobs:
  release:
    name: "Version or publish indy-charts"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pkg.github.com

    permissions:
      # write: push the version branch, open the Version Packages PR, publish.
      contents: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changesets diffs against the base branch

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # indy-charts bundles chartjs-financial into its dist, so that builds first.
      - name: Build and test the package
        run: |
          pnpm --filter @facioquo/chartjs-chart-financial run build
          pnpm --filter @facioquo/indy-charts run build
          pnpm --filter @facioquo/indy-charts run test

      # v2 is required by @changesets/cli v3, and renames every input v1 used.
      # The token goes to `github-token`; v2 dropped the GITHUB_TOKEN env var.
      # npm auth comes from actions/setup-node's registry-url above, since v2
      # no longer writes .npmrc from NPM_TOKEN.
      #
      # The Version Packages PR opens under GITHUB_TOKEN, so its CI waits for an
      # "Approve and run" press before `lint-and-test` reports. See
      # .changeset/README.md.
      - name: Open the version pull request, or publish
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          commit-message: "chore: Version packages"
          pr-title: "chore: Version packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
