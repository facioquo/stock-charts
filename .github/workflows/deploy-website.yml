name: Deploy website

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - "server/**"
      - ".github/workflows/deploy-website.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # `packages: read` lets GITHUB_TOKEN resolve @facioquo scope from GitHub
  # Packages (.npmrc routes @facioquo:registry=https://npm.pkg.github.com).
  packages: read
  # `deployments`/`pull-requests` let wrangler-action record the Pages
  # deployment and surface its preview URL on the PR.
  deployments: write
  pull-requests: write

env:
  NODE_VERSION: 24

jobs:
  versioning:
    name: Define version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.marker.outputs.version }}

    steps:
      - name: Define marker
        id: marker
        run: echo "version=$(date +'%Y.%m.%d')-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Summary output
        run: |
          {
            echo "| Info | Value |"
            echo "| :--- | :---- |"
            echo "| Version | ${{ steps.marker.outputs.version }} |"
          } >> $GITHUB_STEP_SUMMARY

  # Verification gate only. The deployable artifact is the container image,
  # which wrangler builds from server/Dockerfile in the deploy-api job.
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    needs:
      - versioning

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"
          dotnet-quality: "ga"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Replace cache markers
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "YYYY.MM.DD"
          replace: "${{ needs.versioning.outputs.version }}"
          regex: false

      - name: Build .NET solution
        run: >
          dotnet build Charts.sln
          --configuration Release
          --property:ContinuousIntegrationBuild=true
          -warnAsError

  # Verification gate only — no push. Catches a broken server/Dockerfile on the
  # PR that changes it, rather than at deploy-api's first real build on main.
  validate-container:
    name: Validate container image
    runs-on: ubuntu-latest
    needs:
      - versioning

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Build container image (no push)
        run: docker build --platform linux/amd64 -f server/Dockerfile server/

  build-website:
    name: Build website
    runs-on: ubuntu-latest
    needs:
      - versioning

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@facioquo"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace cache markers
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "YYYY.MM.DD"
          replace: "${{ needs.versioning.outputs.version }}"
          regex: false

      - name: Inject Google Analytics tag
        if: github.ref == 'refs/heads/main'
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "__GaTag__"
          replace: "G-17DX6ZW6HP"
          regex: false
          include: "web/index.html"

      - name: Build libraries
        run: |
          pnpm --filter @facioquo/chartjs-chart-financial run build
          pnpm --filter @facioquo/indy-charts run build

      - name: Build site
        run: pnpm --filter @stock-charts/web run build
        env:
          INDICATORS_API_BASE: ${{ vars.INDICATORS_API_BASE || 'https://stock-charts-api.stockindicators.workers.dev' }}

      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: web/dist/app
          include-hidden-files: true

  # Builds the container image from server/Dockerfile and deploys it together
  # with the Worker that fronts it and refreshes quote datasets.
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - versioning
      - build-backend

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@facioquo"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Must run before the image is built: the marker becomes the ETag the
      # /indicators endpoint serves.
      - name: Replace cache markers
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "YYYY.MM.DD"
          replace: "${{ needs.versioning.outputs.version }}"
          regex: false

      # Runs the lockfile-pinned wrangler rather than wrangler-action's
      # "latest", so the CLI that builds and pushes the container image matches
      # the @cloudflare/containers version the Worker is type-checked against.
      # Alpaca credentials are set once with `wrangler secret put`, never here.
      - name: Deploy Worker and container
        run: pnpm --filter @stock-charts/edge exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - versioning
      - build-backend
      - build-website
      - deploy-api
    # deploy-api only runs on main; it is 'skipped' for preview builds, which
    # must still be allowed to publish. On main, a failed API deploy must NOT
    # be masked by a green Pages deployment.
    if: |
      always() &&
      needs.build-backend.result == 'success' &&
      needs.build-website.result == 'success' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'charts.stockindicators.dev' || 'preview' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}

    steps:
      - name: Download Web package
        uses: actions/download-artifact@v8
        with:
          name: web
          path: artifacts/web

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "latest"
          command: >
            pages deploy artifacts/web
            --project-name=stock-charts

      - name: Tag and draft release note
        uses: ncipollo/release-action@v1
        if: github.ref == 'refs/heads/main'
        with:
          body: |
            We’ve updated [charts.stockindicators.dev](https://charts.stockindicators.dev)
          generateReleaseNotes: true
          draft: true
          tag: ${{ needs.versioning.outputs.version }}
          commit: ${{ github.ref_name }}
