name: Deploy website

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - "server/**"
      - ".github/workflows/deploy-website.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Write access is granted only to the deploy job that publishes and tags.
permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  # Fork PRs get no secrets, so nothing here can deploy for them. Every other
  # job needs this one, so skipping it skips the whole run; CI verifies forks.
  versioning:
    name: Define version
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      version: ${{ steps.marker.outputs.version }}

    steps:
      - name: Define marker
        id: marker
        run: echo "version=$(date +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Summary output
        run: |
          {
            echo "| Info | Value |"
            echo "| :--- | :---- |"
            echo "| Version | ${{ steps.marker.outputs.version }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Verification gate only — no push. Catches a broken server/Dockerfile on the
  # PR that changes it, rather than at deploy-api's first real build on main.
  validate-container:
    name: Validate container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # On main, deploy-api builds the same image for real.
    if: github.event_name == 'pull_request'
    needs:
      - versioning

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build container image (no push)
        run: docker build --platform linux/amd64 -f server/Dockerfile server/

  build-website:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - versioning

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{ env.NODE_VERSION }}
          require-lockfile: true

      - name: Replace cache markers
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "YYYY.MM.DD"
          replace: "${{ needs.versioning.outputs.version }}"
          regex: false

      - name: Inject Google Analytics tag
        if: github.ref == 'refs/heads/main'
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "__GaTag__"
          replace: "G-17DX6ZW6HP"
          regex: false
          include: "web/index.html"

      - name: Build libraries
        run: |
          pnpm --filter @facioquo/chartjs-chart-financial run build
          pnpm --filter @facioquo/indy-charts run build

      - name: Build site
        run: pnpm --filter @stock-charts/web run build

      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: web/dist/app
          include-hidden-files: true
          retention-days: 1

  # Builds the container image from server/Dockerfile and deploys it together
  # with the Worker that fronts it and refreshes quote datasets.
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # main only merges through CI's required `gate`, which builds and tests
    # the backend, so this job does not rebuild it first.
    if: github.ref == 'refs/heads/main'
    needs:
      - versioning

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{ env.NODE_VERSION }}
          require-lockfile: true

      # Must run before the image is built: the marker becomes the ETag the
      # /indicators endpoint serves.
      - name: Replace cache markers
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "YYYY.MM.DD"
          replace: "${{ needs.versioning.outputs.version }}"
          regex: false

      # Runs the lockfile-pinned wrangler rather than wrangler-action's
      # "latest", so the CLI that builds and pushes the container image matches
      # the @cloudflare/containers version the Worker is type-checked against.
      # Alpaca credentials are set once with `wrangler secret put`, never here.
      - name: Deploy Worker and container
        run: pnpm --filter @stock-charts/edge exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - versioning
      - build-website
      - deploy-api
    # deploy-api only runs on main; it is 'skipped' for preview builds, which
    # must still be allowed to publish. On main, a failed API deploy must NOT
    # be masked by a green Pages deployment.
    if: |
      always() &&
      needs.versioning.result == 'success' &&
      needs.build-website.result == 'success' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')

    permissions:
      # The release tag
      contents: write
      # wrangler-action records the Pages deployment and its preview URL.
      deployments: write
      pull-requests: write

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'charts.stockindicators.dev' || 'preview' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}

    steps:
      - name: Download Web package
        uses: actions/download-artifact@v8
        with:
          name: web
          path: artifacts/web

      # This job has no `actions/checkout` step — it only downloads the built
      # `web` artifact — so there is no .git directory for wrangler's branch
      # auto-detection to read. Per Cloudflare's own fallback, a deploy that
      # cannot resolve a branch is uploaded as a PRODUCTION deployment. Without
      # an explicit --branch, every PR preview build was silently overwriting
      # charts.stockindicators.dev instead of publishing a preview alias.
      # github.head_ref is the PR's source branch (pull_request events),
      # falling back to github.ref_name for workflow_dispatch. Only a branch
      # matching the Pages project's configured production branch (main) is
      # ever promoted to production.
      #
      # Interpolated directly (not via an env: var + shell reference): this
      # action's `command:` input is parsed by @actions/exec's ToolRunner,
      # which spawns wrangler directly (no shell), so there's no `$VAR`
      # expansion to route through and no shell metacharacters for a branch
      # name to inject. git branch names cannot contain spaces or shell
      # metacharacters, so they cannot be tokenized into extra arguments either.
      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "latest"
          command: >
            pages deploy artifacts/web
            --project-name=stock-charts
            --branch=${{ github.head_ref || github.ref_name }}

      # The offline snapshot is a static file. A host rewrite that answers the
      # path with the SPA shell returns 200 text/html, so only a JSON parse
      # proves the snapshot is served. Preview deployments sit behind
      # Cloudflare Access and answer with its login page, so only the public
      # production host is checked.
      - name: Verify the offline snapshot is served as JSON
        if: github.ref == 'refs/heads/main'
        env:
          SNAPSHOT_URL: https://charts.stockindicators.dev/data/chart-api/quotes.json
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 "$SNAPSHOT_URL" \
                | jq -e 'type == "array" or type == "object"' > /dev/null; then
              echo "Snapshot served as JSON"
              exit 0
            fi
            echo "Attempt $attempt did not return JSON"
            if [ "$attempt" -lt 5 ]; then sleep 10; fi
          done
          echo "::error::$SNAPSHOT_URL is not served as JSON"
          exit 1

      - name: Tag and draft release note
        uses: ncipollo/release-action@v1
        if: github.ref == 'refs/heads/main'
        with:
          body: |
            We’ve updated [charts.stockindicators.dev](https://charts.stockindicators.dev)
          generateReleaseNotes: true
          draft: true
          tag: ${{ needs.versioning.outputs.version }}
          commit: ${{ github.ref_name }}
