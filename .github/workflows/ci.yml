name: "CI"

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

# Default to read-only access to repo contents; jobs that need more (e.g.
# dorny/test-reporter writing check runs) override at the job level.
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # dorny/test-reporter writes a check run with the parsed .trx results.
      contents: read
      checks: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          dotnet-quality: "ga"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build .NET solution
        run: >
          dotnet build Charts.sln
          --configuration Release
          --property:ContinuousIntegrationBuild=true
          -warnAsError

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run Roslynator analysis
        run: dotnet tool run roslynator analyze

      - name: Check .NET code formatting
        run: dotnet format --verify-no-changes --severity info

      # Microsoft.Testing.Platform runner (opted in via global.json): the project
      # goes to `--project`, and everything after `--` is passed to the test
      # application (the xUnit TRX reporter). Any token `dotnet test` does not
      # recognize is forwarded to the test application as a filter, which
      # silently matches zero tests -- hence no bare `-warnAsError` here. The
      # build step above already enforces warnings-as-errors over these same
      # projects and configuration, so the tests run against its output.
      - name: Run backend tests
        run: |
          dotnet test --project server/WebApi.Tests/WebApi.Tests.csproj \
            --configuration Release \
            --no-build \
            --results-directory ./server/test-results \
            -- \
            --report-xunit-trx \
            --report-xunit-trx-filename backend.trx

      - name: Publish backend test results
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: xUnit Tests
          path: server/test-results/*.trx
          reporter: dotnet-trx

  test-libraries:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{ env.NODE_VERSION }}
          require-lockfile: true

      - name: Build libraries
        run: |
          pnpm --filter @facioquo/chartjs-chart-financial run build
          pnpm --filter @facioquo/indy-charts run build

      - name: Lint libraries
        run: |
          pnpm --filter '@facioquo/chartjs-chart-financial' run lint --max-warnings=0
          pnpm --filter '@facioquo/indy-charts' run lint --max-warnings=0

      # Spec files sit outside the build tsconfig, so `build` alone never checks
      # them. This runs the config that includes them.
      - name: Typecheck libraries
        run: |
          pnpm --filter '@facioquo/chartjs-chart-financial' run typecheck
          pnpm --filter '@facioquo/indy-charts' run typecheck

      # The published interface contract. Structural validity is checked here;
      # its agreement with the types and the packed files is asserted in
      # libs/indy-charts/backing-api.spec.ts, which runs with the library tests.
      - name: Lint the indy-charts OpenAPI spec
        run: pnpm --filter '@facioquo/indy-charts' run lint:openapi

      # The VitePress host and the Node build scripts have ESLint configs but no
      # other job that runs them; they ride here because this job has the built
      # libraries the VitePress host imports.
      - name: Lint VitePress host and root scripts
        run: |
          pnpm --filter @stock-charts/vitepress-example run lint --max-warnings=0
          pnpm run lint:scripts --max-warnings=0

      - name: Run library unit tests
        run: pnpm run test:libs

      - name: Run package consumption smoke test
        run: pnpm run smoke:package-consumption

  test-edge-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{ env.NODE_VERSION }}
          require-lockfile: true

      - name: Check edge worker formatting
        run: pnpm --filter @stock-charts/edge run format:check

      - name: Lint edge worker
        run: pnpm --filter @stock-charts/edge run lint --max-warnings=0

      - name: Typecheck edge worker
        run: pnpm --filter @stock-charts/edge run typecheck

      - name: Run edge worker unit tests
        run: pnpm --filter @stock-charts/edge run test

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{ env.NODE_VERSION }}
          require-lockfile: true

      - name: Build libraries
        # web/ consumes @facioquo/indy-charts via workspace:* and imports from
        # its dist/, so libs must be built before the web build/test steps.
        run: |
          pnpm --filter @facioquo/chartjs-chart-financial run build
          pnpm --filter @facioquo/indy-charts run build

      - name: Check web formatting
        run: pnpm run format:web:check

      - name: Lint web app
        run: pnpm --filter @stock-charts/web run lint --max-warnings=0

      - name: Typecheck web app
        run: pnpm --filter @stock-charts/web run typecheck

      - name: Lint CSS
        run: pnpm run lint:css

      # Coverage here enforces the thresholds in web/vitest.config.ts.
      - name: Run web unit tests with coverage
        run: pnpm --filter @stock-charts/web run test:coverage

      - name: Build web app
        run: pnpm --filter @stock-charts/web run build

  # Gated on the library job, whose lint and unit tests catch most breakage in
  # the code both sites render, before browser minutes start.
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-libraries]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{ env.NODE_VERSION }}
          require-lockfile: true

      - name: Build libraries
        # React dev server (used by Playwright's webServer config) runs from
        # source but needs the consumed library dist/ output to exist.
        run: |
          pnpm --filter @facioquo/chartjs-chart-financial run build
          pnpm --filter @facioquo/indy-charts run build

      # Headless runs use only the headless shell, so the full browser build
      # is not downloaded.
      - name: Install Playwright Chromium
        run: pnpm --filter @stock-charts/playwright-tests exec playwright install --with-deps --only-shell chromium

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright/playwright-report/
          retention-days: 3

  gate:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs: [test-backend, test-edge-worker, test-libraries, test-web, test-e2e]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more required jobs did not succeed."
          exit 1
