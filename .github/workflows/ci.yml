name: "CI"

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

# Default to read-only access to repo contents; jobs that need more (e.g.
# dorny/test-reporter writing check runs) override at the job level.
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # dorny/test-reporter writes a check run with the parsed .trx results.
      contents: read
      checks: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"
          dotnet-quality: "ga"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build .NET solution
        run: >
          dotnet build Charts.sln
          --configuration Release
          --property:ContinuousIntegrationBuild=true
          -warnAsError

      - name: Verify .NET formatting
        run: dotnet format Charts.sln --verify-no-changes

      # Microsoft.Testing.Platform runner (opted in via global.json): the project
      # goes to `--project`, and everything after `--` is passed to the test
      # application (coverlet.MTP and the xUnit TRX reporter). Any token
      # `dotnet test` does not recognize is forwarded to the test application as
      # a filter, which silently matches zero tests -- hence no bare
      # `-warnAsError` here. The "Build .NET solution" step above already
      # enforces warnings-as-errors over these same projects and configuration.
      - name: Run backend tests with coverage
        run: |
          dotnet tool restore
          dotnet test --project server/WebApi.Tests/WebApi.Tests.csproj \
            --configuration Release \
            --results-directory ./server/coverage \
            --property:ContinuousIntegrationBuild=true \
            -- \
            --coverlet \
            --coverlet-output-format cobertura \
            --report-xunit-trx \
            --report-xunit-trx-filename backend.trx

      - name: Convert coverage to lcov format
        run: |
          dotnet tool run reportgenerator \
            -reports:"server/coverage/coverage.cobertura*.xml" \
            -targetdir:"server/coverage" \
            -reporttypes:"lcov"

      - name: Upload backend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./server/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Publish backend test results
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: xUnit Tests
          path: server/coverage/*.trx
          reporter: dotnet-trx

  test-libraries:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `packages: read` lets GITHUB_TOKEN resolve @facioquo scope from GitHub
    # Packages (.npmrc routes @facioquo:registry=https://npm.pkg.github.com).
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@facioquo"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build libraries
        run: |
          pnpm --filter @facioquo/chartjs-chart-financial run build
          pnpm --filter @facioquo/indy-charts run build

      - name: Lint libraries
        run: |
          pnpm --filter '@facioquo/chartjs-chart-financial' run lint --max-warnings=0
          pnpm --filter '@facioquo/indy-charts' run lint --max-warnings=0

      # The published interface contract. Structural validity is checked here;
      # its agreement with the types and the packed files is asserted in
      # libs/indy-charts/openapi.spec.ts, which runs with the library tests.
      - name: Lint the indy-charts OpenAPI spec
        run: pnpm --filter '@facioquo/indy-charts' run lint:openapi

      # The VitePress host and the Node build scripts have ESLint configs but no
      # other job that runs them; they ride here because this job has the built
      # libraries the VitePress host imports.
      - name: Lint VitePress host and root scripts
        run: |
          pnpm --filter @stock-charts/vitepress-example run lint --max-warnings=0
          pnpm run lint:scripts --max-warnings=0

      - name: Run library unit tests
        run: pnpm run test:libs

      - name: Run package consumption smoke test
        run: pnpm run smoke:package-consumption

  test-edge:
    name: Test edge worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `packages: read` lets GITHUB_TOKEN resolve @facioquo scope from GitHub
    # Packages (.npmrc routes @facioquo:registry=https://npm.pkg.github.com).
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@facioquo"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check edge worker formatting
        run: pnpm --filter @stock-charts/edge run format:check

      - name: Lint edge worker
        run: pnpm --filter @stock-charts/edge run lint --max-warnings=0

      - name: Typecheck edge worker
        run: pnpm --filter @stock-charts/edge run typecheck

      - name: Run edge worker unit tests
        run: pnpm --filter @stock-charts/edge run test

  test-web:
    needs: [test-libraries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `packages: read` lets GITHUB_TOKEN resolve @facioquo scope from GitHub
    # Packages (.npmrc routes @facioquo:registry=https://npm.pkg.github.com).
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@facioquo"

      - name: Verify GitHub Packages auth
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${NODE_AUTH_TOKEN}" \
            https://npm.pkg.github.com/@facioquo/indy-charts)
          echo "Registry auth check: HTTP ${STATUS}"
          [ "$STATUS" = "200" ] || { echo "Expected 200, got ${STATUS}"; exit 1; }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        # web/ consumes @facioquo/indy-charts via workspace:* and imports from
        # its dist/, so libs must be built before the web build/test steps.
        run: |
          pnpm --filter @facioquo/chartjs-chart-financial run build
          pnpm --filter @facioquo/indy-charts run build

      - name: Check web formatting
        run: pnpm run format:web:check

      - name: Lint web app
        run: pnpm --filter @stock-charts/web run lint --max-warnings=0

      - name: Lint CSS
        run: pnpm run lint:css

      - name: Run web unit tests with coverage
        run: pnpm --filter @stock-charts/web run test:coverage

      - name: Upload frontend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./web/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Build web app
        run: pnpm --filter @stock-charts/web run build

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-libraries, test-web]
    # `packages: read` lets GITHUB_TOKEN resolve @facioquo scope from GitHub
    # Packages (.npmrc routes @facioquo:registry=https://npm.pkg.github.com).
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@facioquo"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build libraries
        # React dev server (used by Playwright's webServer config) runs from
        # source but needs the consumed library dist/ output to exist.
        run: |
          pnpm --filter @facioquo/chartjs-chart-financial run build
          pnpm --filter @facioquo/indy-charts run build

      - name: Install Playwright Chromium
        run: pnpm --filter @stock-charts/playwright-tests exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright/playwright-report/
          retention-days: 3

  lint-and-test:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs: [test-backend, test-edge, test-libraries, test-web, test-e2e]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs did not succeed."
          exit 1
