name: Copilot Environment Setup

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: 24

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          dotnet-quality: "ga"
          cache: true
          cache-dependency-path: "**/packages.lock.json"
        continue-on-error: true

      - name: Install .NET tools
        run: dotnet tool restore
        continue-on-error: true

      - name: Build .NET Solution
        run: |
          dotnet clean Charts.sln
          dotnet build Charts.sln --no-incremental
        continue-on-error: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@facioquo"
        continue-on-error: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Install browser for E2E tests
        run: pnpm exec playwright install --with-deps chromium
        continue-on-error: true

      - name: Environment summary
        run: |
          {
            echo "## Copilot environment: Ready"
            echo "- Repository: ${{ github.repository }}"
            echo "- .NET SDKs: $(dotnet --list-sdks | wc -l) versions available"
            echo "- .NET Tools: $(dotnet tool list --global | wc -l) available"
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
