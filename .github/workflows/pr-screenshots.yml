name: PR screenshots

# Before and after screenshots of the React site's scenes, written into a pull
# request's description ("Pull request screenshots" in @facioquo/react-ui's
# llms.txt). Opt-in: a pull request gets them only while it carries the
# `pr-screenshots` label, and adding the label runs it. A push to main stores
# the scenes every pull request compares against; workflow_dispatch on main
# seeds the first baseline.
#
# It never gates a merge: screenshots inform a review. The scenes come from
# tests/playwright/pr-screenshots.spec.ts.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
    paths:
      - "web/**"
      - "libs/chartjs-financial/**"
      - "libs/indy-charts/**"
      - "tests/playwright/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pr-screenshots.yml"
  workflow_dispatch:

# A pull request's run is superseded by its next push. Baseline runs queue, so
# the older commit's scenes never land after a newer one's. Adding some other
# label starts a run that does nothing, so it takes a group of its own rather
# than cancelling a capture.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{
    github.event.action == 'labeled' && github.event.label.name != 'pr-screenshots'
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  capture:
    # On a pull request: only while it carries the label, never as a draft,
    # and not when some other label is added. A fork's pull request is left
    # out, as its token cannot write the screenshots back. Otherwise: main.
    if: >-
      ${{ github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'pr-screenshots')
      && !github.event.pull_request.draft
      && (github.event.action != 'labeled' || github.event.label.name == 'pr-screenshots')
      && github.event.pull_request.head.repo.full_name == github.repository
      || github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@stock-charts/web..." --filter @stock-charts/playwright-tests

      # The dev server runs from source but reads the libraries' dist/ output.
      - name: Build libraries
        run: |
          pnpm --filter @facioquo/chartjs-chart-financial run build
          pnpm --filter @facioquo/indy-charts run build

      - name: Install Playwright Chromium
        run: pnpm --filter @stock-charts/playwright-tests exec playwright install --with-deps chromium

      # Never a failure: a capture problem leaves the description saying this
      # push has no screenshots.
      - name: Capture PR screenshots
        id: capture-screenshots
        continue-on-error: true
        timeout-minutes: 5
        working-directory: tests/playwright
        run: pnpm exec playwright test --project=pr-screenshots
        env:
          CI: true
          PR_SCREENSHOTS: ${{ runner.temp }}/pr-screenshots

      # Only a complete capture: a partial one would list its failed scenes as
      # removed.
      - name: Upload PR screenshots
        if: steps.capture-screenshots.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pr-screenshots
          path: ${{ runner.temp }}/pr-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 1

  # A job of its own so the write token never sits beside the site's install
  # and build. With no artifact, publish writes that the push has no
  # screenshots, and baseline leaves main's scenes as they were.
  publish:
    runs-on: ubuntu-latest
    needs: capture
    if: ${{ !cancelled() && needs.capture.result != 'skipped' }}
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      packages: read

    steps:
      - name: Download PR screenshots
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-screenshots
          path: ${{ runner.temp }}/pr-screenshots

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: "@facioquo"

      # Installed apart from the step that writes, with lifecycle scripts off,
      # so no dependency of the tool runs code beside the write token.
      - name: Install the screenshot tool
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm install --ignore-scripts --omit=peer --no-audit --no-fund --prefix "$RUNNER_TEMP/tool" @facioquo/react-ui@0.31.0

      - name: Publish PR screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'pull_request' && 'publish' || 'baseline' }}
        run: '"$RUNNER_TEMP/tool/node_modules/.bin/facioquo-pr-screenshots" "$MODE" "$RUNNER_TEMP/pr-screenshots"'
