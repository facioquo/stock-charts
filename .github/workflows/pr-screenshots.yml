name: PR screenshots

# Before and after screenshots of the React site's scenes, written into a pull
# request's description ("Pull request screenshots" in @facioquo/react-ui's
# llms.txt). Opt-in: a pull request gets them only while it carries the
# `pr-screenshots` label, and adding the label runs it. The after scenes come
# from the pull request, and the before scenes from its base commit, so
# nothing runs on main.
#
# It never gates a merge: screenshots inform a review. The scenes come from
# tests/playwright/pr-screenshots.spec.ts.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# A pull request's run is superseded by its next push. Adding some other label
# starts a run that does nothing, so it takes a group of its own rather than
# cancelling a capture.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number }}${{
    github.event.action == 'labeled' && github.event.label.name != 'pr-screenshots'
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  # Decides what this push needs before anything is built. A commit's content
  # key hashes every file the scenes render from, so a base whose key an
  # earlier pull request already stored is not captured again, however far
  # main moved through unrelated merges; and when neither key differs from the
  # ones the description records, the description already shows this push:
  # no capture and no publish.
  #
  # Every step continues on error. A plan that fails leaves its outputs empty,
  # which captures and publishes everything, as before plan existed.
  plan:
    # Only while the pull request carries the label, never as a draft, and
    # not when some other label is added. A fork's pull request is left out,
    # as its token cannot write the screenshots back.
    if: >-
      ${{ contains(github.event.pull_request.labels.*.name, 'pr-screenshots')
      && !github.event.pull_request.draft
      && (github.event.action != 'labeled' || github.event.label.name == 'pr-screenshots')
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
      # Reading the live description, where the last publish recorded its keys.
      pull-requests: read
    outputs:
      key: ${{ steps.plan.outputs.key }}
      base-key: ${{ steps.plan.outputs.base-key }}
      base-stored: ${{ steps.plan.outputs.base-stored }}
      current: ${{ steps.plan.outputs.current }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: "@facioquo"

      # The same pinned tool as the publish job, installed the same way.
      - name: Install the screenshot tool
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm install --ignore-scripts --omit=peer --no-audit --no-fund --prefix "$RUNNER_TEMP/tool" @facioquo/react-ui@0.33.0

      # What the scenes render from: the React site with its bundled snapshot,
      # the chart libraries it builds, the capture spec and its config, the
      # workspace manifests, and this file; less unit specs and Markdown,
      # which no scene renders. Quoted, so the shell never expands a glob.
      - name: Plan PR screenshots
        id: plan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          "$RUNNER_TEMP/tool/node_modules/.bin/facioquo-pr-screenshots" plan
          "web/**" "libs/**" "tests/playwright/**"
          "package.json" "pnpm-lock.yaml" "pnpm-workspace.yaml" ".npmrc"
          ".github/workflows/pr-screenshots.yml"
          "!web/**/*.spec.ts" "!web/**/*.spec.tsx" "!libs/**/*.spec.ts" "!**/*.md"

  # The after side captures the pull request; the before side captures its
  # base commit with that commit's own code. The before side is left out of
  # the matrix when plan found the base's scenes already stored, so it costs
  # nothing, and the job is skipped when the description is already current.
  capture:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result != 'skipped' && needs.plan.outputs.current != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Each side independent: a base that fails to build must not cancel the
    # pull request's own capture.
    strategy:
      fail-fast: false
      matrix:
        side: ${{ fromJSON(needs.plan.outputs.base-stored == 'true' && '["after"]' || '["after","before"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.side == 'before' && github.event.pull_request.base.sha || '' }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@stock-charts/web..." --filter @stock-charts/playwright-tests

      # The dev server runs from source but reads the libraries' dist/ output.
      - name: Build libraries
        run: |
          pnpm --filter @facioquo/chartjs-chart-financial run build
          pnpm --filter @facioquo/indy-charts run build

      - name: Install Playwright Chromium
        run: pnpm --filter @stock-charts/playwright-tests exec playwright install --with-deps chromium

      # Never a failure: a capture problem leaves the description saying this
      # push has no screenshots. Playwright's global timeout stops it at a
      # limit, keeping the scenes it took; the step's own is the backstop.
      - name: Capture PR screenshots
        id: capture-screenshots
        continue-on-error: true
        timeout-minutes: 5
        working-directory: tests/playwright
        run: pnpm exec playwright test --project=pr-screenshots --global-timeout=240000
        env:
          CI: true
          PR_SCREENSHOTS: ${{ runner.temp }}/pr-screenshots

      # Whatever the capture took, even when it ran out of time: scenes.txt
      # names the rest, which the description lists as not captured.
      - name: Upload PR screenshots
        if: steps.capture-screenshots.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: pr-screenshots-${{ matrix.side }}
          path: |
            ${{ runner.temp }}/pr-screenshots/*.png
            ${{ runner.temp }}/pr-screenshots/scenes.txt
          if-no-files-found: ignore
          retention-days: 1

  # A job of its own so the write token never sits beside the site's install
  # and build. With no after artifact, publish writes that the push has no
  # screenshots; with no before artifact, it reads the base's stored scenes.
  publish:
    runs-on: ubuntu-latest
    needs: [plan, capture]
    if: ${{ !cancelled() && needs.capture.result != 'skipped' }}
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      packages: read

    steps:
      - name: Download PR screenshots
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-screenshots-after
          path: ${{ runner.temp }}/pr-screenshots/after

      - name: Download the base's screenshots
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-screenshots-before
          path: ${{ runner.temp }}/pr-screenshots/before

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: "@facioquo"

      # Installed in a step of its own with install scripts off, so no
      # dependency runs code while installing.
      - name: Install the screenshot tool
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm install --ignore-scripts --omit=peer --no-audit --no-fund --prefix "$RUNNER_TEMP/tool" @facioquo/react-ui@0.33.0

      # Plan's keys: the base's scenes are stored and read by content key, and
      # both keys are recorded in the description for the next push's plan.
      - name: Publish PR screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SCREENSHOTS_KEY: ${{ needs.plan.outputs.key }}
          PR_SCREENSHOTS_BASE_KEY: ${{ needs.plan.outputs.base-key }}
        run: '"$RUNNER_TEMP/tool/node_modules/.bin/facioquo-pr-screenshots" publish "$RUNNER_TEMP/pr-screenshots"'
