---
exclude_paths:
  - ".claude/**"
  - "tests/vitepress/.vitepress/theme/custom.css"
  - "web/**/*.scss"
  # Codacy's own MCP server, a developer tool that never ships; its remaining
  # advisories sit in Codacy's bundled linters, fixable only upstream
  - "tools/codacy-mcp/**"
engines:
  # Lizard's file-length rule; generated lockfiles stay in the Trivy scan
  lizard:
    exclude_paths:
      - "pnpm-lock.yaml"
      - "**/pnpm-lock.yaml"
  metric:
    exclude_paths:
      - "pnpm-lock.yaml"
      - "**/pnpm-lock.yaml"
