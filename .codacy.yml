---
exclude_paths:
  - ".claude/**"
  - "tests/vitepress/.vitepress/theme/custom.css"
  - "web/**/*.scss"
  # Codacy's own MCP server, a developer tool that never ships; its remaining
  # advisories sit in Codacy's bundled linters, fixable only upstream
  - "tools/codacy-mcp/**"
engines:
  # Lizard's file-length rule; generated lockfiles stay in the Trivy scan
  lizard:
    exclude_paths:
      - "pnpm-lock.yaml"
      - "**/pnpm-lock.yaml"
  metric:
    exclude_paths:
      - "pnpm-lock.yaml"
      - "**/pnpm-lock.yaml"
  # xss/no-mixed-html reads DOM nodes as HTML strings. Both files are test-only
  # code: the spec hands elements to Testing Library (`within`, `fireEvent`), and
  # the setup stubs jsdom's missing popover API on `HTMLElement.prototype`.
  # Neither builds markup, and the repo's own ESLint still lints both in CI.
  eslint-8:
    exclude_paths:
      - "web/src/components/picker/SettingsDialog.spec.tsx"
      - "web/src/test-setup.ts"
