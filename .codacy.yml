---
exclude_paths:
  - ".claude/**"
  - "tests/vitepress/.vitepress/theme/custom.css"
  - "web/**/*.scss"
engines:
  # Lizard's file-length rule; generated lockfiles stay in the Trivy scan
  lizard:
    exclude_paths:
      - "pnpm-lock.yaml"
      - "**/pnpm-lock.yaml"
  metric:
    exclude_paths:
      - "pnpm-lock.yaml"
      - "**/pnpm-lock.yaml"
  # xss/no-mixed-html reads DOM nodes as HTML strings. The spec hands elements to
  # Testing Library (`within`, `fireEvent`), and the test setup stubs jsdom's
  # missing popover API on `HTMLElement.prototype`; neither builds markup. The
  # repo's own ESLint still lints both in CI.
  eslint-8:
    exclude_paths:
      - "web/src/components/picker/SettingsDialog.spec.tsx"
      - "web/src/test-setup.ts"
