openapi: 3.1.0

info:
  title: indy-charts chart data API
  # Placeholder. The build overwrites this from package.json, so the shipped
  # copy states its release; this value is not maintained by hand.
  version: "0.9.2"
  summary: The HTTP interface @facioquo/indy-charts expects from a quote and indicator source.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    `@facioquo/indy-charts` can render charts from data you supply directly, with no HTTP involved. This specification describes the alternative: the interface its built-in API client calls when you point it at a server with `createApiClient({ baseUrl })`.

    Implement the first three operations and the library will drive your server. The fourth, the batch, is optional. A reference implementation of the .NET side lives in <https://github.com/facioquo/stock-charts>.

    ## The catalog drives everything

    There is no fixed list of indicator routes. `GET /indicators` returns a catalog, each entry carrying an `endpoint` and the `parameters` it accepts, and the client builds its indicator requests from that. Adding an indicator is a catalog change, not a specification change — which is why this document describes one templated indicator operation rather than enumerating a particular server's routes.

    Entries do not map one-to-one onto endpoints: several may share an endpoint and differ only in which `results` they chart.

    ## Field naming

    Responses are camelCase. Timestamps are ISO 8601 strings; the client also accepts a `Date` when data is supplied in-process rather than over HTTP.
# Matches the value the specification already defaults to when `servers` is
# absent. It is not the resolution root: the client builds request URLs with
# `new URL(endpoint, baseUrl)` in application code, never from this field.
servers:
  - url: /
    description: Placeholder. The origin is whatever you pass as the client's `baseUrl`.

# No authentication. The client sends no credentials, so an implementation that
# requires them will not work with it unaltered.
security: []

tags:
  - name: quotes
    description: Raw OHLCV price history.
  - name: catalog
    description: Which indicators exist and how to call them.
  - name: indicators
    description: Computed indicator series.

paths:
  /quotes:
    get:
      tags: [quotes]
      operationId: getQuotes
      summary: Price history for the charted security
      description: |
        Returns the OHLCV bars the price chart renders, oldest first. The client calls this once per chart load via `ApiClient.getQuotes()`.
      responses:
        "200":
          description: Bars in chronological order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bar" }
        "503":
          $ref: "#/components/responses/Unavailable"

  /indicators:
    get:
      tags: [catalog]
      operationId: getIndicatorCatalog
      summary: Catalog of available indicators
      description: |
        Returns every indicator this server can compute, with the endpoint to call, the parameters it accepts, and how each result series should be drawn. The client calls this once via `ApiClient.getListings()` and builds its indicator picker from it.

        Each entry's `endpoint` is resolved with `new URL(endpoint, baseUrl)`, so it may be either an absolute URL or a path relative to the configured `baseUrl`. A server behind a proxy that emits absolute URLs must emit its public origin, not the address it sees the request arrive on.
      responses:
        "200":
          description: Indicator listings.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IndicatorListing" }
        "503":
          $ref: "#/components/responses/Unavailable"

  /indicators/batch:
    get:
      tags: [indicators]
      operationId: getIndicatorBatch
      summary: Computed series for several indicators in one call
      description: |
        **Optional.** `ApiClient.getSelectionsData()` sends this request so a page load needs one call for every indicator it shows. A server without the route loses nothing: on a `404`, `405`, `400`, `413` or `414` the client requests each indicator on its own, through `getIndicatorData`, and does not ask for the batch again. The client makes one attempt at the batch, and sends at most 20 `s` values per request.

        Each `s` value names one indicator request: the path of the URL the catalog entry's `endpoint` resolves to, relative to the API base and without the leading or trailing slash, then `?` and the query the single request would carry, for example `BB?lookbackPeriods=20&standardDeviations=2`. Percent-encode the value. The response lists one result per `s`, in request order, each echoing its `s` value as `selection` and carrying the status the single request would have answered and, on `200`, the same rows.

        Respond `200` when every selection succeeded, and `207` when any did not, so a partial answer is never cached as the whole. The client matches items to requests by `selection` when any item carries one (an item without it is treated as unanswered and requested alone), so the order cannot misattribute rows, and by position when none does; echo it wherever a cache or proxy in front of your server could reorder repeated `s` values. A client takes only the `200` items from a `207` and requests the rest on their own. A server that implements this route must accept at least 20 `s` values, because the client sends that many per request; it may accept more. The reference server accepts exactly 20 and answers `400` with a plain-text message to a request over its cap. The client treats any `400` as a refusal of the route and stops asking, so where you can, answer a selection you cannot run with its own `207` item rather than rejecting the request with a `400`. The client sends neither an empty request nor one over 20. A selection that fails on the server answers its own item (`500`) without affecting the others. A repeated parameter takes its first value, and a missing one its default, as in the single request.
      parameters:
        - name: s
          in: query
          required: true
          style: form
          explode: true
          description: One indicator request, repeated once per selection.
          schema:
            type: array
            items: { type: string }
            minItems: 1
          example: ["BB?lookbackPeriods=20&standardDeviations=2", "ADX?lookbackPeriods=14"]
      responses:
        "200":
          description: Every selection succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndicatorBatch" }
        "207":
          description: At least one selection failed; each item carries its own `status`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndicatorBatch" }
        "400":
          description: No `s` values, or more than the server accepts.
        "503":
          $ref: "#/components/responses/Unavailable"

  /{indicatorPath}:
    get:
      tags: [indicators]
      operationId: getIndicatorData
      summary: Computed series for one indicator
      description: |
        Returns the computed rows for a single indicator.

        **This path is a modelling device, not a literal route.** OpenAPI cannot express "whatever URL a previous response named", so this operation stands in for the URL the client actually requests, which it derives as `new URL(listing.endpoint, baseUrl)`. When `endpoint` is absolute, that URL is fetched directly and `baseUrl` is not consulted at all, so nothing is ever appended to `servers.url` here. When `endpoint` is relative, it resolves against `baseUrl`.

        Both forms work. What a server must guarantee is that the URL `endpoint` resolves to answers this operation.

        Query parameters come from the catalog entry's `parameters`: the client sends each `paramName` with the user's chosen value, so a server receives exactly the parameters it advertised, and nothing else.

        Each row carries a `timestamp` plus one field per `dataName` in the listing's `results`. A field may be `null` where the indicator has no value for that bar, which is normal during an indicator's warm-up period.
      parameters:
        - name: indicatorPath
          in: path
          required: true
          description: |
            Stands in for the path of the URL `listing.endpoint` resolves to. Where `endpoint` is `https://data.example.com/BB/`, this path is `BB/`.
          schema: { type: string }
          example: BB/
        - name: lookbackPeriods
          in: query
          required: false
          description: |
            Illustrative only. The real parameters are whatever the catalog entry declares; each is sent by its `paramName`. `BB` sends `lookbackPeriods` and `standardDeviations`, `DOJI` sends `maxPriceChangePercent`, and an indicator with an empty `parameters` array is called with no query string at all.
          schema: { type: integer }
          example: 20
      responses:
        "200":
          description: Computed rows in chronological order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IndicatorDataRow" }
        "400":
          description: A parameter fell outside the range the catalog declared.
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  responses:
    Unavailable:
      description: |
        The source data is temporarily unavailable. The client retries any 5xx, and 429, with exponential back-off, honours `Retry-After`, then falls back to its last good cached response. Every other 4xx is final and surfaces to the caller, so use 503 for a condition a retry could resolve and 429 to ask for a slower one.

        This is guidance for your implementation rather than observed behaviour of any particular server: a source that falls back to bundled data when its upstream fails will answer 200 here instead.
  schemas:
    Bar:
      type: object
      description: One OHLCV price bar.
      required: [timestamp, open, high, low, close, volume]
      properties:
        timestamp:
          type: string
          format: date-time
          description: Bar open time, ISO 8601.
          example: "2026-09-02T04:00:00Z"
        open: { type: number, example: 706.82 }
        high: { type: number, example: 709.77 }
        low: { type: number, example: 705.185 }
        close: { type: number, example: 709.32 }
        volume: { type: number, example: 375937 }
        date:
          type: string
          format: date-time
          deprecated: true
          description: |
            Legacy alias for `timestamp` some sources emit. The client ignores it; a new implementation should omit it.
    IndicatorListing:
      type: object
      description: One indicator in the catalog — how to call it, and how to draw it.
      required:
        [
          name,
          uiid,
          legendTemplate,
          endpoint,
          category,
          chartType,
          order,
          chartConfig,
          parameters,
          results
        ]
      properties:
        name:
          type: string
          description: Display name for the picker.
          example: Bollinger Bands®
        uiid:
          type: string
          description: Stable identifier, unique within the catalog.
          example: BB
        legendTemplate:
          type: string
          description: Legend label; `[P1]`, `[P2]`… are replaced by parameter values in order.
          example: BB([P1],[P2])
        endpoint:
          type: string
          format: uri-reference
          description: |
            Where this indicator is fetched from, resolved as `new URL(endpoint, baseUrl)`. An absolute URL is fetched as given and ignores `baseUrl`; a relative reference such as `BB/` resolves against it.
          examples:
            - https://data.example.com/BB/
            - BB/
        category:
          type: string
          description: |
            Grouping for the picker. `candlestick-pattern` is behavioural: rows in that category carry `candle`, and the client renders point markers from it.
          example: price-channel
        chartType:
          type: string
          description: |
            `overlay` draws on the price chart; `oscillator` draws in its own pane below.
          enum: [overlay, oscillator]
        order:
          type: number
          description: Z-order. Lower draws on top.
          example: 1
        chartConfig:
          oneOf:
            - $ref: "#/components/schemas/ChartConfig"
            - type: "null"
          description: Axis bounds and threshold lines; null when the defaults suffice.
        parameters:
          type: array
          items: { $ref: "#/components/schemas/IndicatorParamConfig" }
          description: User-adjustable inputs. Empty when the indicator takes none.
        results:
          type: array
          items: { $ref: "#/components/schemas/IndicatorResultConfig" }
          description: One entry per series the indicator returns.

    IndicatorParamConfig:
      type: object
      description: One user-adjustable input, and the bounds the picker enforces.
      required: [displayName, paramName, dataType, defaultValue, minimum, maximum]
      properties:
        displayName: { type: string, example: Lookback Periods }
        paramName:
          type: string
          description: Query-string name the client sends this value as.
          example: lookbackPeriods
        dataType: { type: string, example: int }
        defaultValue: { type: number, example: 20 }
        minimum: { type: number, example: 2 }
        maximum: { type: number, example: 250 }

    IndicatorResultConfig:
      type: object
      description: One series within an indicator, and how to draw it.
      required: [displayName, tooltipTemplate, dataName, dataType, lineType, stack, defaultColor]
      properties:
        displayName: { type: string, example: Upper Band }
        tooltipTemplate: { type: string, example: Upper Band }
        dataName:
          type: string
          description: Key this series appears under in each data row.
          example: upperBand
        dataType: { type: string, example: number }
        lineType:
          type: string
          description: |
            `solid`, `dash`, `dots`, `bar`, `pointer`, or `candle`. `candle` renders OHLC results as candlesticks in their own pane.
          example: solid
        stack:
          type: string
          description: Stack group for bar series; empty when unstacked.
        lineWidth:
          type: [number, "null"]
        defaultColor:
          type: string
          description: CSS colour applied when the user has not overridden it.
          example: "#B58AB5"
        fill:
          oneOf:
            - $ref: "#/components/schemas/ChartFill"
            - type: "null"
        segmented:
          type: boolean
          description: |
            Draw as flat segments that step at boundaries, rather than a continuous line — for level series such as monthly pivot points.
        segmentMode:
          type: string
          enum: [step, slope]
          description: Where to break segments when `segmented` is set. Defaults to `step`.

    ChartConfig:
      type: object
      description: Axis bounds and threshold lines for an indicator's pane.
      required: [minimumYAxis, maximumYAxis, thresholds]
      properties:
        minimumYAxis:
          type: [number, "null"]
        maximumYAxis:
          type: [number, "null"]
        thresholds:
          type: array
          items: { $ref: "#/components/schemas/ChartThreshold" }

    ChartThreshold:
      type: object
      description: A horizontal reference line, such as RSI's 70 and 30.
      required: [value, color, style]
      properties:
        value: { type: number, example: 70 }
        color: { type: string, example: "#DDDDDD50" }
        style: { type: string, example: dash }
        fill:
          oneOf:
            - $ref: "#/components/schemas/ChartFill"
            - type: "null"

    ChartFill:
      type: object
      description: Shading relative to another series or a threshold.
      required: [target, colorAbove, colorBelow]
      properties:
        target:
          type: string
          description: Dataset index or threshold identifier to fill against.
        colorAbove: { type: string }
        colorBelow: { type: string }

    CandlestickShape:
      type: object
      description: |
        Proportions of a single candle, sent alongside its OHLCV on `candlestick-pattern` rows. The `*Pct` ratios are the corresponding measure divided by `size`, so they sum to 1.

        Documented from observed responses. The library's own `IndicatorDataRow.candle` is typed `Bar`, which these fields extend rather than contradict — a consumer reading the type alone would not know they arrive.
      required:
        [size, body, upperWick, lowerWick, bodyPct, upperWickPct, lowerWickPct, isBullish, isBearish]
      properties:
        size:
          type: number
          description: High minus low.
          example: 4.585
        body:
          type: number
          description: Absolute difference between open and close.
          example: 2.5
        upperWick:
          type: number
          description: High minus the higher of open and close.
          example: 0.45
        lowerWick:
          type: number
          description: The lower of open and close, minus low.
          example: 1.635
        bodyPct: { type: number, example: 0.5452562704471101 }
        upperWickPct: { type: number, example: 0.09814612868047982 }
        lowerWickPct: { type: number, example: 0.35659760087241005 }
        isBullish:
          type: boolean
          description: Close is above open.
          example: true
        isBearish:
          type: boolean
          description: Close is below open.
          example: false

    IndicatorBatch:
      type: array
      description: One result per requested selection, in request order.
      items:
        type: object
        required: [status]
        properties:
          selection:
            type: string
            description: The `s` value this item answers, exactly as the request spelled it. Optional, but a server should echo it; the client then matches items to requests by it rather than by position.
            example: ADX?lookbackPeriods=14
          status:
            type: integer
            description: The status the single indicator request would have answered.
            example: 200
          data:
            type: array
            description: Present when `status` is `200`.
            items: { $ref: "#/components/schemas/IndicatorDataRow" }
          error:
            type: string
            description: Present when the selection failed; why.

    IndicatorDataRow:
      type: object
      description: |
        One computed row. Beyond `timestamp`, the keys are the `dataName` values from the listing's `results` — so the shape varies per indicator and cannot be enumerated here. A value is `null` where the indicator has not warmed up.
      required: [timestamp]
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-09-02T04:00:00Z"
        candle:
          allOf:
            - $ref: "#/components/schemas/Bar"
            - $ref: "#/components/schemas/CandlestickShape"
          description: |
            Present on `candlestick-pattern` rows only. The bar's OHLCV plus its shape metrics, which the client uses to place and rotate the pattern marker.
      additionalProperties:
        description: One indicator series value, keyed by its `dataName`.
        type: [number, string, boolean, "null"]
      example:
        timestamp: "2026-09-02T04:00:00Z"
        sma: 717.55775
        upperBand: 732.3101882645718
        lowerBand: 702.8053117354283
        percentB: 0.22080039067904103
        zScore: -1.1167984372838382
        width: 0.041118469599336814
