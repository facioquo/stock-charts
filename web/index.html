  <body class="dark-theme">
    <!-- Paints the first frame in the right theme. Mirrors the rules in src/services/userPrefs.ts. -->
    <script>
      (function () {
        var stored = null;
        var chosen = false;
        var followsSystem = false;
        var systemLight = false;
        // Each read fails on its own, as in userPrefs.ts, so a failure still reaches the system scheme.
        try {
          stored = JSON.parse(localStorage.getItem("settings") || "null");
        } catch (e) {}
        try {
          chosen = localStorage.getItem("settings.themeChosen") === "true";
          followsSystem = localStorage.getItem("settings.themeFollowsSystem") === "true";
        } catch (e) {}
        try {
          systemLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        } catch (e) {}
        var dark;
        if (chosen && stored && typeof stored.isDarkTheme === "boolean") dark = stored.isDarkTheme;
        else if (stored && stored.isDarkTheme === false && !followsSystem) dark = false;
        else dark = !systemLight;
        document.body.className = dark ? "dark-theme" : "light-theme";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#121316" : "#fafafa");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
